---
###############################################################################
# Filename: handlers/main.yml
# Role: ansible-role-rhel-rke2-stig
# Summary: Event handlers for RHEL RKE2 STIG compliance role
# Last Updated: 23 Jan 2026
# Classification: UNCLASSIFIED
###############################################################################
- name: Check if auditd is running
  ansible.builtin.command:
    cmd: systemctl is-active auditd
  register: auditd_active
  changed_when: false
  failed_when: false
  listen: Reload auditd rules

# Read immutability BEFORE the reload. `augenrules --load` exits 0 without applying
# anything when the audit system is already immutable (`-e 2`); see check_immutable()
# in /usr/sbin/augenrules, which prints "Audit system is in immutable mode - exiting
# with no changes" and returns 0. Sampling this after the reload could not distinguish
# "we just set -e 2 successfully" from "we were locked and did nothing".
- name: Check whether the audit system is already immutable
  ansible.builtin.shell:
    cmd: set -o pipefail && auditctl -s | awk '$1 == "enabled" { print $2 }'
    executable: /bin/bash
  register: audit_immutable_pre
  changed_when: false
  failed_when: false
  when: auditd_active.rc == 0
  listen: Reload auditd rules

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  register: augenrules_load
  changed_when: true
  # The RKE2 audit rules watch runtime paths (/etc/rancher, /var/lib/rancher/...,
  # /run/k3s/..., rke2 unit files) that do not exist until RKE2 is installed. When
  # this role runs as a build-time pre-stage (golden image) rather than runtime
  # enforcement on a live node, augenrules loads every other rule but returns rc=1
  # for those missing-path watches; they activate once their paths exist. Tolerate
  # ONLY that missing-path case - any other augenrules error (e.g. a malformed
  # rule) still fails. Mirrors the build/container tolerance on "Reload sysctl".
  failed_when:
    - augenrules_load.rc != 0
    - "'No such file or directory' not in augenrules_load.stderr"
  when: auditd_active.rc == 0
  listen: Reload auditd rules

# This handler only runs when something notified it, i.e. a rules file CHANGED this
# run. If the audit system was already immutable, that pending change was silently
# discarded by augenrules and will not exist in the kernel until a reboot re-reads
# /etc/audit/audit.rules. Reporting success here is what let a broken ruleset ship
# while `harden.sh` reported failed=0.
- name: Fail if audit rule changes could not be applied (immutable mode)
  ansible.builtin.fail:
    msg: >-
      Audit rules changed this run, but the audit system is in immutable mode
      (-e 2), so `augenrules --load` exited 0 WITHOUT APPLYING THEM. The kernel is
      still running the previously loaded ruleset. REBOOT to apply the pending
      rules, then re-run to verify. Set
      rhel_rke2_stig_audit_immutable_pending_is_fatal=false to downgrade this to a
      warning if you are staging changes for a later maintenance reboot.
  when:
    - auditd_active.rc == 0
    - audit_immutable_pre.stdout | default('') | trim == '2'
    - rhel_rke2_stig_audit_immutable_pending_is_fatal | bool
  listen: Reload auditd rules

# The opt-out downgrades severity, never visibility. A silent pass here is exactly
# the behaviour this issue exists to remove.
- name: Warn that audit rule changes are pending a reboot (immutable mode, non-fatal)
  ansible.builtin.debug:
    msg: >-
      WARNING: audit rules changed but the audit system is immutable (-e 2), so
      they were NOT applied. The kernel is still running the previously loaded
      ruleset. This node REQUIRES A REBOOT before its audit baseline matches what
      this role just wrote. Downgraded to a warning by
      rhel_rke2_stig_audit_immutable_pending_is_fatal=false.
  when:
    - auditd_active.rc == 0
    - audit_immutable_pre.stdout | default('') | trim == '2'
    - not (rhel_rke2_stig_audit_immutable_pending_is_fatal | bool)
  listen: Reload auditd rules

# Catches the whole "rules silently did not load" class regardless of cause: a rule
# the kernel rejects (EPERM on a symlinked -F path=, "Rule exists" on a duplicate)
# makes augenrules ABORT, dropping every later rule AND the trailing `-e 2`. The
# ruleset on disk still looks complete, so only runtime state reveals it.
# `-e 2` is the last line augenrules emits, so "did immutability actually take
# effect" is a single high-signal assertion that the load ran to completion - far
# more robust than counting rules, which legitimately varies at build time when
# missing-path watches do not load.
- name: Check whether the assembled ruleset requests immutability
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if grep -qE '^[[:space:]]*-e[[:space:]]+2[[:space:]]*$' /etc/audit/audit.rules; then
        echo yes
      else
        echo no
      fi
    executable: /bin/bash
  register: audit_rules_request_immutable
  changed_when: false
  failed_when: false
  when:
    - auditd_active.rc == 0
    - audit_immutable_pre.stdout | default('') | trim != '2'
  listen: Reload auditd rules

- name: Verify the audit ruleset loaded to completion
  ansible.builtin.shell:
    cmd: set -o pipefail && auditctl -s | awk '$1 == "enabled" { print $2 }'
    executable: /bin/bash
  register: audit_immutable_post
  changed_when: false
  failed_when: false
  when:
    - auditd_active.rc == 0
    - audit_immutable_pre.stdout | default('') | trim != '2'
  listen: Reload auditd rules

- name: Fail if the audit ruleset requests immutability but did not reach it
  ansible.builtin.fail:
    msg: >-
      /etc/audit/audit.rules ends with `-e 2` but the audit system reports
      enabled={{ audit_immutable_post.stdout | default('') | trim }}. augenrules
      ABORTED before the final rule, so an unknown number of rules are NOT loaded
      and the audit configuration is still mutable. Compare `auditctl -l` against
      /etc/audit/audit.rules and check the augenrules output for "Error sending add
      rule data request" to find the offending rule.
  when:
    - auditd_active.rc == 0
    - audit_immutable_pre.stdout | default('') | trim != '2'
    - audit_rules_request_immutable.stdout | default('no') | trim == 'yes'
    - audit_immutable_post.stdout | default('') | trim != '2'
  listen: Reload auditd rules

###############################################################################
# fapolicyd Handlers - Application Whitelisting
###############################################################################
- name: Check if fapolicyd is running
  ansible.builtin.command:
    cmd: systemctl is-active fapolicyd
  register: fapolicyd_active
  changed_when: false
  failed_when: false
  listen: Reload fapolicyd rules

- name: Update fapolicyd rules
  ansible.builtin.command:
    cmd: fapolicyd-cli --update
  changed_when: true
  when: fapolicyd_active.rc == 0
  listen: Reload fapolicyd rules

###############################################################################
# Sysctl Handlers - Kernel Parameter Tuning
# Note: sysctl --system may fail in containers where kernel parameters cannot
#   be modified. Config files are deployed regardless; settings apply on reboot
#   or when running on real hardware/VMs.
###############################################################################
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  failed_when: false
  listen: Reload sysctl

###############################################################################
# SSH Handlers - OpenSSH Server Configuration
###############################################################################
- name: Check if sshd is running
  ansible.builtin.command:
    cmd: systemctl is-active sshd
  register: sshd_active
  changed_when: false
  failed_when: false
  listen: Restart sshd

- name: Restart sshd service
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  when: sshd_active.rc == 0
  listen: Restart sshd

###############################################################################
# NetworkManager Handlers - CNI Interface Configuration
###############################################################################
- name: Check if NetworkManager is running
  ansible.builtin.command:
    cmd: systemctl is-active NetworkManager
  register: networkmanager_active
  changed_when: false
  failed_when: false
  listen: Reload NetworkManager

- name: Reload NetworkManager configuration
  ansible.builtin.command:
    cmd: nmcli general reload conf
  changed_when: true
  when: networkmanager_active.rc == 0
  listen: Reload NetworkManager

###############################################################################
# SSSD Handlers - System Security Services Daemon
###############################################################################
- name: Check if sssd is running
  ansible.builtin.command:
    cmd: systemctl is-active sssd
  register: sssd_active
  changed_when: false
  failed_when: false
  listen: Restart sssd

- name: Restart sssd service
  ansible.builtin.systemd:
    name: sssd
    state: restarted
  when: sssd_active.rc == 0
  listen: Restart sssd

###############################################################################
# PC/SC Smart Card Handlers - Smart Card Daemon
###############################################################################
- name: Check if pcscd is running
  ansible.builtin.command:
    cmd: systemctl is-active pcscd
  register: pcscd_active
  changed_when: false
  failed_when: false
  listen: Restart pcscd

- name: Restart pcscd service
  ansible.builtin.systemd:
    name: pcscd
    state: restarted
  when: pcscd_active.rc == 0
  listen: Restart pcscd

###############################################################################
# Postfix Handlers - Mail Service
###############################################################################
- name: Check if postfix is running
  ansible.builtin.command:
    cmd: systemctl is-active postfix
  register: postfix_active
  changed_when: false
  failed_when: false
  listen: Reload postfix

- name: Reload postfix configuration
  ansible.builtin.command:
    cmd: postfix reload
  changed_when: true
  when: postfix_active.rc == 0
  listen: Reload postfix
