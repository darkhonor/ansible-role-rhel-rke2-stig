    - CAT II

###########################################################
# STIG ID: RHEL-10-800250    Group ID: V-281357    (RHEL 10 only)
# Rule Title: RHEL 10 must not enable IPv6 packet forwarding unless the system
#   is a router. Default (rhel_rke2_stig_ipv6_enabled=false) enforces the STIG
#   (=0). When true, IPv6 forwarding is enabled (=1) for dual-stack RKE2 as a
#   documented exemption (mirrors the IPv4 forwarding exemption). Written to
#   /etc/sysctl.conf so it wins over the STIG base. No RHEL 9 equivalent control.
# Severity: CAT II
###########################################################
- name: RHEL-10-800250 | Set IPv6 forwarding (0=STIG default, 1=RKE2 dual-stack exemption)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "{{ '1' if rhel_rke2_stig_ipv6_enabled | bool else '0' }}"
    state: present
    sysctl_file: /etc/sysctl.conf
    reload: false
  loop:
    - net.ipv6.conf.all.forwarding
    - net.ipv6.conf.default.forwarding
  notify: Reload sysctl
  when: ansible_distribution_major_version is version('10', '>=')
  tags:
    - rke2
    - sysctl
    - RHEL-10-800250
    - CAT II

###########################################################
# AIDE file integrity: exclude Kubernetes container logs.
# STIG IDs: RHEL-09-651010 / RHEL-10-671010 (AIDE must be installed and used)
#   are satisfied by the base profile; this fills the RKE2-specific gap.
# Severity: CAT II
#
# Stock /etc/aide.conf watches /var/log recursively (the `/var/log LOG` rule).
# kubelet creates /var/log/pods/ and /var/log/containers/ at RKE2 install, i.e.
# AFTER the image is baked, so they are swept into that rule silently. The SSG
# remediation aide_use_fips_hashes then puts sha512 into the LOG group, which is
# supposed to be size-only, so those append-only container logs are CONTENT
# HASHED. On a running node they change every few seconds and `aide --check` can
# never return 0 - integrity monitoring is permanently red and therefore useless,
# which is worse than not running it: a real intrusion is indistinguishable from
# the expected noise.
#
# Scoped deliberately to the Kubernetes paths only. /var/log/audit/audit.log has
# the same churn problem from the same cause, but it is a BASE-OS concern on every
# RHEL host, not an RKE2 gap, and excluding it would weaken a base control this
# role does not own. It is left in place; see README.
#
# NOTE: changing aide.conf REQUIRES re-initializing the AIDE database. Entries
# already in the database for now-excluded paths have no filesystem counterpart on
# the next scan and are reported as REMOVED. Re-baselining is a deploy-time action
# (it must capture the final state of a specific node), so this role warns rather
# than running `aide --init` itself.
###########################################################
- name: AIDE | Check whether aide is installed
  ansible.builtin.stat:
    path: "{{ rhel_rke2_stig_aide_conf_path }}"
  register: rhel_rke2_stig_aide_conf
  when: rhel_rke2_stig_aide_exclusions_enabled | bool
  tags:
    - rke2
    - aide
    - CAT II

- name: AIDE | Exclude Kubernetes container log paths from file integrity checks
  ansible.builtin.blockinfile:
    path: "{{ rhel_rke2_stig_aide_conf_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - rhel_rke2_stig kubernetes log exclusions"
    block: |
      {% for path in rhel_rke2_stig_aide_exclusions %}
      !{{ path }}
      {% endfor %}
    insertafter: EOF
    owner: root
    group: root
    mode: "0600"
  register: rhel_rke2_stig_aide_block
  when:
    - rhel_rke2_stig_aide_exclusions_enabled | bool
    - rhel_rke2_stig_aide_conf.stat.exists | default(false)
  tags:
    - rke2
    - aide
    - CAT II

- name: AIDE | Warn that the AIDE database must be re-initialized
  ansible.builtin.debug:
    msg: >-
      AIDE exclusions changed in {{ rhel_rke2_stig_aide_conf_path }}. The AIDE
      DATABASE IS NOW STALE: entries for the newly excluded paths remain in it and
      will be reported as REMOVED on the next check until the baseline is rebuilt.
      Re-initialize at deploy time, after provisioning is complete, with:
      `aide --init && mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz`.
      This role does not do it: a valid baseline must capture the final state of a
      specific node, which is not knowable at role-apply or image-bake time.
  when:
    - rhel_rke2_stig_aide_exclusions_enabled | bool
    - rhel_rke2_stig_aide_block.changed | default(false)
  tags:
    - rke2
    - aide
    - CAT II
