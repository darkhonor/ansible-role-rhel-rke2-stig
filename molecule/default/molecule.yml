---
###############################################################################
# Filename: molecule/default/molecule.yml
# Role: ansible-role-rhel-rke2-stig
# Summary: Molecule test configuration for RHEL 9 STIG compliance testing
# Last Updated: 23 Jan 2026
# Classification: UNCLASSIFIED
###############################################################################
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    role-file: requirements.yml

driver:
  name: podman

platforms:
  - name: rhel9-stig
    # Rocky Linux 9: downstream bug-for-bug RHEL 9 rebuild (higher STIG
    # fidelity than upstream CentOS Stream). Ships BaseOS/AppStream
    # preconfigured with GPG keys, so no external repos or key fetches are
    # needed in prepare.yml. quay.io avoids Docker Hub anonymous pull limits.
    image: quay.io/rockylinux/rockylinux:9@sha256:53f4c6dcb34e1403bd93207351f0af9a593610faeb7165cb8a037346765199b0
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    # cgroups v2 compatibility for GitHub Actions runners
    cgroupns_mode: host
    tmpfs:
      /run: rw,noexec,nosuid,size=65536k
      /tmp: rw,noexec,nosuid
    capabilities:
      - SYS_ADMIN
      - AUDIT_WRITE
      - AUDIT_CONTROL

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      rhel9-stig:
        ansible_python_interpreter: /usr/bin/python3
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      gathering: smart
      fact_caching: jsonfile
      fact_caching_connection: /tmp/ansible_facts
    ssh_connection:
      pipelining: true

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
