###############################################################################
# Filename: vars/main.yml
# Role: ansible-role-rhel-rke2-stig
# Summary: Internal constants shared across every supported RHEL-family version.
#   Version-varying STIG data (audit rules + kernel module blacklist) lives in
#   vars/rhel9.yml and vars/rhel10.yml and is loaded by tasks/main.yml based on
#   ansible_distribution_major_version. Auto-loaded by Ansible for all hosts.
# Last Updated: 21 Jun 2026
# Classification: UNCLASSIFIED
###############################################################################

# RHEL-family major versions this role supports. tasks/main.yml asserts the
# target is one of these, then loads vars/rhel<major>.yml accordingly.
rhel_rke2_stig_supported_majors:
  - "9"
  - "10"
