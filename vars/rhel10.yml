###############################################################################
# Filename: vars/rhel10.yml
# Role: ansible-role-rhel-rke2-stig
# Summary: Fixed variables for RHEL RKE2 STIG compliance - RHEL 10 (V1R1) dataset -
#   contains audit rules and kernel module blacklist for RHEL 10 systems
# Last Updated: 21 Jun 2026
# Classification: UNCLASSIFIED
###############################################################################
rhel_rke2_stig_audit_rules:
  # STIG ID: RHEL-10-500300    Group ID: V-281116
  # Severity: CAT II
  - stig_id: "RHEL-10-500300"
    group_id: "V-281116"
    rule_title: >
      RHEL 10 must generate audit records for successful and unsuccessful uses
      of the "execve" system call.
    severity: "CAT II"
    audit_rule: |
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv

  # STIG ID: RHEL-10-500780    Group ID: V-281163
  # Severity: CAT II
  - stig_id: "RHEL-10-500780"
    group_id: "V-281163"
    rule_title: >
      RHEL 10 must generate audit records for all uses of the "chmod",
      "fchmod", "fchmodat", and "fchmodat2" syscalls.
    severity: "CAT II"
    audit_rule: |
      -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat,fchmodat2 -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,fchmodat2 -F auid>=1000 -F auid!=unset -k perm_mod

