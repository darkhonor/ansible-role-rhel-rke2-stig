  # STIG ID: RHEL-10-500680    Group ID: V-281154
  # Severity: CAT II
  # NOTE: Watch rewritten as syscall rule in R10 (R9 used "-w /etc/sudoers -p wa
  #   -k identity"). Key also changed from "identity" (R9) to "logins" (R10).
  - stig_id: "RHEL-10-500680"
    group_id: "V-281154"
    rule_title: >
      RHEL 10 must generate audit records for all account creations,
      modifications, disabling, and termination events that affect
      "/etc/sudoers".
    severity: "CAT II"
